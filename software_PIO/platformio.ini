; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_lolin32_arduino, stm32_bluepill_arduino, stm32_bluepill_cube_ll, stm32_bluepill_libopencm3, stm32_bluepill_cmsis

[esp32_arduino]
platform = espressif32
framework = arduino
board_build.partitions = tools/spiffs_4MB.csv
board_build.filesystem = littlefs
extra_scripts = tools/littlefs-python.py
lib_deps =
    WiFi
    LittleFS
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
lib_ignore =
    Protothreads

[esp32_idf]
platform = espressif32
framework = espidf
board_build.partitions = tools/spiffs_4MB.csv
board_build.filesystem = littlefs
extra_scripts = tools/littlefs-python.py
lib_deps =
    https://github.com/joltwallet/esp_littlefs.git
lib_ignore =
    Protothreads

[stm32_f103c6]
platform = ststm32
board = bluepill_f103c6
upload_protocol = serial
lib_ldf_mode = off
lib_deps =
    Protothreads

[env:esp32c3_supermini_arduino]
extends = esp32_arduino
board = lolin_c3_mini
build_src_flags =
    -D OPENTENS_USE_ESP32_ARDUINO

[env:esp32c3_supermini_idf]
extends = esp32_idf
board = lolin_c3_mini
build_src_flags =
    -D OPENTENS_USE_ESP32_IDF

[env:esp32_lolin32_arduino]
extends = esp32_arduino
board = lolin32_lite
build_src_flags =
    -D OPENTENS_USE_ESP32_ARDUINO

[env:esp32_lolin32_idf]
extends = esp32_idf
board = lolin32_lite
build_src_flags =
    -D OPENTENS_USE_ESP32_IDF

[env:stm32_bluepill_arduino]
extends = stm32_f103c6
framework = arduino
build_src_flags =
    -D OPENTENS_USE_STM32_ARDUINO

[env:stm32_bluepill_cube_ll]
extends = stm32_f103c6
framework = stm32cube
build_flags =
    -D USE_FULL_LL_DRIVER
build_src_flags =
    -D OPENTENS_USE_STM32_CUBE_LL

[env:stm32_bluepill_libopencm3]
extends = stm32_f103c6
framework = libopencm3
build_src_flags =
    -D OPENTENS_USE_STM32_LIBOPENCM3

[env:stm32_bluepill_cmsis]
extends = stm32_f103c6
framework = cmsis
build_src_flags =
    -D OPENTENS_USE_STM32_CMSIS
